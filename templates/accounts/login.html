{% extends 'base.html' %}

{% block title %}Login - Library Management System{% endblock %}

{% block content %}
<main class="auth-container">

    <div class="auth-card">
        <h2>Member Login</h2>

        {% if form.errors %}
            <div class="alert alert-danger">
                <p>Invalid username or password. Please try again.</p>
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
    
            {{ form.as_p }}

            <button type="submit" class="auth-btn">Login</button>
        </form>

        <p class="auth-footer-text">
         Don't have an account? <a href="{% url 'accounts:signup' %}" style="color: #38bdf8; text-decoration: none; font-weight: bold;">Sign up</a>
        </p>
    </div>
</main>
{% endblock %}
