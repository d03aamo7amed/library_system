
{% extends 'base.html' %}

{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 50px auto; padding: 30px; background: rgba(30, 30, 45, 0.85); color: white; border-radius: 12px; backdrop-filter: blur(10px);">
    <h2 style="text-align: center; margin-bottom: 20px;">Member Sign Up</h2>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; padding: 10px; background-color: #38bdf8; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px;">Sign Up</button>
    </form>

    <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
        Already have an account? <a href="{% url 'accounts:login' %}" style="color: #38bdf8; text-decoration: none;">Login</a>
    </p>
</div>
{% endblock %}
